name: Test Suite

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    name: Verify folding engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run test suite
        run: pytest
      - name: Headless anchor verification
        run: python verify_z97_headless.py
      - name: Verify install and entry point
        run: |
          pip install .
          python -c "print(('ABCDEFGHIJKLMNOPQRSTUVWXYZ'*4)[:97])" | fold --permute | fold --invert
