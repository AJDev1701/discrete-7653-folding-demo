[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name            = "discrete-7653-folding-demo"
version         = "0.1.1"
description     = "Deterministic integer permutation engine using the 76/53 generator ratio over a 97-position block. No cryptographic claims."
license         = { text = "MIT" }
requires-python = ">=3.11"
dependencies    = []

[project.scripts]
fold = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where   = ["."]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
