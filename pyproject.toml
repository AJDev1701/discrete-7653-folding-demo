[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name        = "discrete-7653-folding-demo"
version     = "0.1.0"
description = "Deterministic permutation engine using the 7653 generator ratio (76/53). Standalone; no solve claims."
license     = { text = "MIT" }
requires-python = ">=3.11"
dependencies    = []

[project.scripts]
fold = "cli:main"

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
